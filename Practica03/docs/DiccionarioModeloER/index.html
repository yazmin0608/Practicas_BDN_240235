`descripcion`,\n 1 AS `fecha_operacion`,\n 1 AS `estado`;","tables":[],"definitionAvailable":false},{"name":"vw_trazabilidad_shipments","sql":"CREATE VIEW `vw_trazabilidad_shipments` AS SELECT \n 1 AS `log_id`,\n 1 AS `table_name`,\n 1 AS `operation`,\n 1 AS `usuario_bd`,\n 1 AS `descripcion`,\n 1 AS `fecha_operacion`,\n 1 AS `estado`;","tables":[],"definitionAvailable":false},{"name":"vw_trazabilidad_tb_payment_transactions","sql":"CREATE VIEW `vw_trazabilidad_tb_payment_transactions` AS SELECT \n 1 AS `log_id`,\n 1 AS `table_name`,\n 1 AS `operation`,\n 1 AS `db_users`,\n 1 AS `description`,\n 1 AS `operation_date`,\n 1 AS `operation_status`;","tables":[],"definitionAvailable":false},{"name":"vw_trazabilidad_tb_payments","sql":"CREATE VIEW `vw_trazabilidad_tb_payments` AS SELECT \n 1 AS `log_id`,\n 1 AS `table_name`,\n 1 AS `operation`,\n 1 AS `db_users`,\n 1 AS `description`,\n 1 AS `operation_date`,\n 1 AS `operation_status`;","tables":[],"definitionAvailable":false},{"name":"vw_trazabilidad_tb_products","sql":"CREATE VIEW `vw_trazabilidad_tb_products` AS SELECT \n 1 AS `log_id`,\n 1 AS `table_name`,\n 1 AS `operation`,\n 1 AS `db_users`,\n 1 AS `description`,\n 1 AS `operation_date`,\n 1 AS `operation_status`;","tables":[],"definitionAvailable":false},{"name":"vw_trazabilidad_tbd_products_categories","sql":"CREATE VIEW `vw_trazabilidad_tbd_products_categories` AS SELECT \n 1 AS `log_id`,\n 1 AS `table_name`,\n 1 AS `operation`,\n 1 AS `db_users`,\n 1 AS `description`,\n 1 AS `operation_date`,\n 1 AS `operation_status`;","tables":[],"definitionAvailable":false},{"name":"vw_trazabilidad_user_addresses","sql":"CREATE VIEW `vw_trazabilidad_user_addresses` AS SELECT \n 1 AS `log_id`,\n 1 AS `user_address_id`,\n 1 AS `operation`,\n 1 AS `db_user`,\n 1 AS `username`,\n 1 AS `roles`,\n 1 AS `operation_description`,\n 1 AS `operation_date`,\n 1 AS `operation_status`;","tables":[],"definitionAvailable":false},{"name":"vw_trazabilidad_user_payment_methods","sql":"CREATE VIEW `vw_trazabilidad_user_payment_methods` AS SELECT \n 1 AS `log_id`,\n 1 AS `user_payment_method_id`,\n 1 AS `operation`,\n 1 AS `db_user`,\n 1 AS `username`,\n 1 AS `roles`,\n 1 AS `operation_description`,\n 1 AS `operation_date`,\n 1 AS `operation_status`;","tables":[],"definitionAvailable":false},{"name":"vw_trazabilidad_users_wishlist_products","sql":"CREATE VIEW `vw_trazabilidad_users_wishlist_products` AS SELECT \n 1 AS `log_id`,\n 1 AS `user_id`,\n 1 AS `operation`,\n 1 AS `db_user`,\n 1 AS `username`,\n 1 AS `roles`,\n 1 AS `operation_description`,\n 1 AS `operation_date`,\n 1 AS `operation_status`;","tables":[],"definitionAvailable":false},{"name":"vw_trazabilidad_usuarios","sql":"CREATE VIEW `vw_trazabilidad_usuarios` AS SELECT \n 1 AS `ID`,\n 1 AS `table_name`,\n 1 AS `operation`,\n 1 AS `db_users`,\n 1 AS `description`,\n 1 AS `operation_date`,\n 1 AS `operation_status`;","tables":[],"definitionAvailable":false}],"routines":[{"kind":"FUNCTION","name":"fn_apellido_prueba","sql":"CREATE FUNCTION `fn_apellido_prueba`(p_num INT) RETURNS varchar(150) CHARSET utf8mb4\n    NO SQL\n    DETERMINISTIC\nBEGIN\n    RETURN ELT(\n        1 + MOD(p_num, 10),\n        'Smith', 'Johnson', 'Williams', 'Brown',\n        'Jones', 'Garcia', 'Miller', 'Davis',\n        'Wilson', 'Anderson'\n    );\nEND ;;"},{"kind":"FUNCTION","name":"fn_estado_prueba","sql":"CREATE FUNCTION `fn_estado_prueba`(\n    p_posicion INT,\n    p_total INT,\n    p_porcentaje_activos DECIMAL(5,2)\n) RETURNS tinyint\n    NO SQL\n    DETERMINISTIC\nBEGIN\n    IF p_posicion <= ROUND(\n        p_total * p_porcentaje_activos / 100, 0\n    ) THEN\n        RETURN 1;\n    END IF;\n\n    RETURN 0;\nEND ;;"},{"kind":"FUNCTION","name":"fn_fecha_nacimiento_prueba","sql":"CREATE FUNCTION `fn_fecha_nacimiento_prueba`(\n    p_edad_min INT,\n    p_edad_max INT,\n    p_num INT\n) RETURNS date\n    NO SQL\nBEGIN\n    DECLARE v_edad INT;\n    DECLARE v_fecha DATE;\n\n    SET v_edad = p_edad_min +\n        MOD(p_num, p_edad_max - p_edad_min + 1);\n\n    SET v_fecha = DATE_SUB(\n        CURDATE(),\n        INTERVAL v_edad YEAR\n    );\n\n    RETURN v_fecha;\nEND ;;"},{"kind":"FUNCTION","name":"fn_nombre_prueba","sql":"CREATE FUNCTION `fn_nombre_prueba`(p_num INT) RETURNS varchar(150) CHARSET utf8mb4\n    NO SQL\n    DETERMINISTIC\nBEGIN\n    RETURN ELT(\n        1 + MOD(p_num, 10),\n        'James', 'Emily', 'Michael', 'Olivia',\n        'Daniel', 'Sophia', 'William', 'Emma',\n        'Alexander', 'Charlotte'\n    );\nEND ;;"},{"kind":"PROCEDURE","name":"sp_generar_usuarios_masivos","sql":"CREATE PROCEDURE `sp_generar_usuarios_masivos`(\n    IN p_prueba VARCHAR(20),\n    IN p_cantidad INT,\n    IN p_pais CHAR(2),\n    IN p_edad_min INT,\n    IN p_edad_max INT,\n    IN p_porcentaje_activos DECIMAL(5,2)\n)\nBEGIN\n    DECLARE v_i INT DEFAULT 1;\n    DECLARE v_user_id INT UNSIGNED;\n    DECLARE v_identificador VARCHAR(64);\n    DECLARE v_nick VARCHAR(100);\n    DECLARE v_email VARCHAR(80);\n    DECLARE v_nombre VARCHAR(150);\n    DECLARE v_apellido VARCHAR(150);\n    DECLARE v_fecha DATE;\n    DECLARE v_estado TINYINT;\n    DECLARE v_activos INT DEFAULT 0;\n    DECLARE v_inactivos INT DEFAULT 0;\n\n    DECLARE EXIT HANDLER FOR SQLEXCEPTION\n    BEGIN\n        ROLLBACK;\n        RESIGNAL;\n    END;\n\n    IF p_cantidad IS NULL OR p_cantidad < 1\n       OR p_cantidad > 50000\n       OR p_edad_min IS NULL\n       OR p_edad_max IS NULL\n       OR p_edad_min < 18\n       OR p_edad_max < p_edad_min\n       OR p_edad_max > 100\n       OR p_porcentaje_activos IS NULL\n       OR p_porcentaje_activos < 0\n       OR p_porcentaje_activos > 100\n       OR p_pais IS NULL\n       OR p_pais NOT REGEXP '^[A-Za-z]{2}$'\n       OR p_prueba IS NULL\n       OR p_prueba NOT REGEXP '^[A-Za-z0-9_]{1,20}$'\n    THEN\n        SIGNAL SQLSTATE '45000'\n        SET MESSAGE_TEXT = 'Parametros de generacion invalidos';\n    END IF;\n\n    SET v_identificador = REPLACE(UUID(), '-', '');\n\n    START TRANSACTION;\n\n    WHILE v_i <= p_cantidad DO\n\n        SET v_nombre = fn_nombre_prueba(v_i);\n        SET v_apellido = fn_apellido_prueba(v_i);\n        SET v_fecha = fn_fecha_nacimiento_prueba(\n            p_edad_min, p_edad_max, v_i\n        );\n\n        SET v_estado = fn_estado_prueba(\n            v_i, p_cantidad, p_porcentaje_activos\n        );\n\n        SET v_nick = CONCAT(\n            'test_', p_prueba, '_',\n            LEFT(v_identificador, 12), '_', v_i\n        );\n\n        SET v_email = CONCAT(\n            v_nick, '@example.com'\n        );\n\n        INSERT INTO tb_users (\n            email,\n            nick,\n            password,\n            status\n        )\n        VALUES (\n            v_email,\n            v_nick,\n            SHA2(CONCAT(UUID(), v_nick), 256),\n            IF(v_estado = 1, b'1', b'0')\n        );\n\n        SET v_user_id = LAST_INSERT_ID();\n\n        INSERT INTO tb_people (\n            user_ID,\n            courtesy_title,\n            given_names,\n            family_names,\n            birth_date,\n            gender_ID,\n            country_code,\n            phone,\n            status\n        )\n        VALUES (\n            v_user_id,\n            NULL,\n            v_nombre,\n            v_apellido,\n            v_fecha,\n            NULL,\n            UPPER(p_pais),\n            NULL,\n            IF(v_estado = 1, b'1', b'0')\n        );\n\n        IF v_estado = 1 THEN\n            SET v_activos = v_activos + 1;\n        ELSE\n            SET v_inactivos = v_inactivos + 1;\n        END IF;\n\n        SET v_i = v_i + 1;\n\n    END WHILE;\n\n    COMMIT;\n\n    SELECT\n        p_prueba AS prueba,\n        p_cantidad AS usuarios_generados,\n        v_activos AS usuarios_activos,\n        v_inactivos AS usuarios_inactivos,\n        UPPER(p_pais) AS pais,\n        p_edad_min AS edad_minima,\n        p_edad_max AS edad_maxima,\n        v_identificador AS identificador_lote,\n        'Generacion completada' AS resultado;\n\nEND ;;"},{"kind":"PROCEDURE","name":"sp_register_user","sql":"CREATE PROCEDURE `sp_register_user`(\n    IN p_email VARCHAR(80),\n    IN p_nick VARCHAR(100),\n    IN p_password VARCHAR(255),\n    IN p_given_names VARCHAR(150),\n    IN p_family_names VARCHAR(150),\n    IN p_courtesy_title VARCHAR(50),\n    IN p_birth_date DATE,\n    IN p_gender_ID TINYINT UNSIGNED,\n    IN p_country_code CHAR(2),\n    IN p_phone VARCHAR(25)\n)\nBEGIN\n\n    DECLARE v_user_ID INT UNSIGNED;\n\n    /* MANEJO DE ERRORES */\n    DECLARE EXIT HANDLER FOR SQLEXCEPTION\n    BEGIN\n        ROLLBACK;\n        RESIGNAL;\n    END;\n\n    START TRANSACTION;\n\n    /* REGISTRAR DATOS EN TB_USERS */\n    INSERT INTO tb_users (\n        email,\n        nick,\n        password\n    )\n    VALUES (\n        p_email,\n        p_nick,\n        MD5(p_password)\n    );\n\n    /* OBTENER ID DEL USUARIO */\n    SET v_user_ID = LAST_INSERT_ID();\n\n    /* REGISTRAR DATOS EN TB_PEOPLE */\n    INSERT INTO tb_people (\n        user_ID,\n        courtesy_title,\n        given_names,\n        family_names,\n        birth_date,\n        gender_ID,\n        country_code,\n        phone\n    )\n    VALUES (\n        v_user_ID,\n        p_courtesy_title,\n        p_given_names,\n        p_family_names,\n        p_birth_date,\n        p_gender_ID,\n        p_country_code,\n        p_phone\n    );\n\n    COMMIT;\n\n    /* MENSAJE DE CONFIRMACION */\n    SELECT\n        v_user_ID AS user_ID,\n        'Usuario registrado correctamente' AS mensaje;\n\nEND ;;"},{"kind":"PROCEDURE","name":"sp_soft_delete_user","sql":"CREATE PROCEDURE `sp_soft_delete_user`(\n    IN p_user_id INT UNSIGNED\n)\n    MODIFIES SQL DATA\nBEGIN\n    DECLARE v_db_user VARCHAR(32);\n    DECLARE v_has_role INT DEFAULT 0;\n    DECLARE v_exists INT DEFAULT 0;\n    DECLARE v_status TINYINT DEFAULT NULL;\n    DECLARE v_affected INT DEFAULT 0;\n\n    -- 1. Identificar usuario de conexión\n    SET v_db_user = SUBSTRING_INDEX(USER(), '@', 1);\n\n    -- 2. Verificar roles autorizados asignados\n    SELECT COUNT(*)\n    INTO v_has_role\n    FROM mysql.role_edges re\n    WHERE re.TO_USER = v_db_user\n      AND re.TO_HOST = '%'\n      AND re.FROM_HOST = '%'\n      AND re.FROM_USER IN (\n          'superadmin',\n          'admin',\n          'support'\n      );\n\n    IF v_has_role = 0 THEN\n        SIGNAL SQLSTATE '45000'\n        SET MESSAGE_TEXT = 'Acceso denegado: rol no autorizado';\n    END IF;\n\n    -- 3. Validar identificador\n    IF p_user_id IS NULL OR p_user_id = 0 THEN\n        SIGNAL SQLSTATE '45000'\n        SET MESSAGE_TEXT = 'El identificador del usuario es inválido';\n    END IF;\n\n    -- 4. Comprobar existencia y estado\n    SELECT COUNT(*), MAX(status + 0)\n    INTO v_exists, v_status\n    FROM tb_users\n    WHERE ID = p_user_id;\n\n    IF v_exists = 0 THEN\n        SIGNAL SQLSTATE '45000'\n        SET MESSAGE_TEXT = 'El usuario especificado no existe';\n    END IF;\n\n    -- 5. Comprobar estado actual\n    IF v_status = 0 THEN\n        SIGNAL SQLSTATE '45000'\n        SET MESSAGE_TEXT = 'El usuario ya se encuentra inactivo';\n    END IF;\n\n    IF v_status IS NULL THEN\n        SIGNAL SQLSTATE '45000'\n        SET MESSAGE_TEXT = 'El usuario tiene un estado inválido';\n    END IF;\n\n    -- 6. Eliminación lógica\n    UPDATE tb_users\n    SET status = b'0'\n    WHERE ID = p_user_id\n      AND status = b'1';\n\n    SET v_affected = ROW_COUNT();\n\n    IF v_affected <> 1 THEN\n        SIGNAL SQLSTATE '45000'\n        SET MESSAGE_TEXT = 'No se pudo desactivar el usuario';\n    END IF;\n\n    -- 7. Registrar auditoría en tb_logs usando 'db_users' en plural\n    INSERT INTO tb_logs (\n        table_name,\n        operation,\n        db_users,\n        description,\n        operation_status\n    )\n    VALUES (\n        'tb_users',\n        'Delete',\n        USER(),\n        CONCAT('Desactivación lógica del usuario ID: ', p_user_id, ' ejecutada por ', v_db_user),\n        b'1'\n    );\n\n    -- 8. Confirmación\n    SELECT\n        'Usuario desactivado correctamente' AS mensaje,\n        p_user_id AS user_id,\n        v_db_user AS ejecutado_por,\n        'Inactivo' AS estado_actual,\n        CURRENT_TIMESTAMP AS fecha_operacion;\n\nEND ;;"}],"expected":{"tables":25,"triggers":72,"views":28,"foreignKeys":36,"inferred":3},"source":"Respaldo_2810.sql","summary":"EER db_test · 25 tablas · 91,703 filas · 36 FK + 3 inferidas","securityNote":"No se embebieron INSERT ni valores de filas. El esquema conserva nombres de columnas; no incluye credenciales. Se eliminaron cláusulas DEFINER. Las vistas del dump contienen únicamente stubs de metadatos, no consultas completas."}</script><script>

function home(){let type={};D.tables.flatMap(t=>t.columns).forEach(c=>{let k=c.type.split(/[ (]/)[0].toLowerCase();type[k]=(type[k]||0)+1});return `<h1>Explorador del esquema <span class="badge">${D.database}</span></h1><p class="sub">Ingeniería inversa de ${D.source} · snapshot analizado, no servidor vivo.</p><div class="grid stats">${stat(D.tables.length,'Tablas físicas','dictionary')}${stat(D.triggers.length,'Triggers','triggers')}${stat(D.views.length,'Vistas','views')}${stat(ncols,'Columnas','dictionary')}${stat(D.relationships.length,'Relaciones del modelo','relations')}${stat(D.routines.length,'Rutinas almacenadas','objects')}${stat(D.tables.reduce((s,t)=>s+t.constraints.length,0),'Índices / restricciones','objects')}${stat(D.tables.reduce((s,t)=>s+t.rowsInserted,0).toLocaleString(),'Tuplas INSERT (no estado final)','records')}${stat(D.relationships.filter(r=>r.explicit).length,'FK explícitas*','relations')}${stat(D.tables.filter(t=>t.columns.some(c=>c.pk)).length,'Tablas con PK','dictionary')}</div><div class="grid twocol"><section class="panel"><h2>Validación del respaldo</h2><table><tr><th>Objeto</th><th>Esperado</th><th>Encontrado</th><th>Estado</th></tr>${[['Tablas',25,D.tables.length],['Triggers',72,D.triggers.length],['Vistas',28,D.views.length]].map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td><span class="badge ${x[1]===x[2]?'green':'orange'}">${x[1]===x[2]?'Coincide':'Diferencia'}</span></td></tr>`).join('')}</table><p class="muted">*El modelo de referencia resume 36 FK y 3 relaciones inferidas; las FK se identifican en el diagrama desde constraints del modelo. El recuento de filas INSERT aquí mostrado se calcula por tuplas del respaldo.</p></section><section class="panel"><h2>Tipos SQL frecuentes</h2>${Object.entries(type).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([k,v])=>`<div style="display:grid;grid-template-columns:95px 1fr 35px;gap:9px;align-items:center;margin:9px 0"><span>${esc(k)}</span><div class="bar"><i style="width:${v/ncol function eer(){return `<h1>Modelo entidad-relación</h1><p class="sub">Arrastra entidades, desplaza el lienzo con Shift + arrastre, y usa rueda para zoom. Selecciona tabla o conexión para detalles.</p><div class="toolbar"><input id="nodeSearch" placeholder="Filtrar entidades" oninput="filterNodes(this.value)"><select id="mode" onchange="draw()"><option value="general">General</option><option value="detailed">Detallado</option><option value="simple">Simplificado</option><option value="focus">Enfocado</option></select><button onclick="zoom(1.2)">＋</button><button onclick="zoom(.83)">−</button><button onclick="fit()">Ajustar</button><button onclick="resetPos()">Restablecer</button><button onclick="exportSvg()">Exportar SVG</button><button onclick="document.querySelector('.diagram').requestFullscreen?.()">Pantalla completa</button><label><input type="checkbox" id="showInferred" checked onchange="draw()"> Inferidas</label></div><div class="panel diagram"><svg id="canvas" role="img" aria-label="Diagrama EER manipulable"></svg><div class="floating"><span class="badge">━━ FK explícita</span><span class="badge orange">┄┄ inferida</span></div></div><div class="panel"><b>Notación:</b> patas de cuervo = muchos; barra = uno. El modelo incluye relaciones explícitas e inferidas con estilos diferenciados. Haz clic en una conexión para ver columnas, cardinalidad y opcionalidad.</div>`}
const entitySize=t=>{let mode=$('#mode')?.value||'general';return {w:Math.max(215,t.layout.width||240),h:34+((mode==='simple')?0:(expanded.has(t.name)||mode==='detailed'?t.columns.length:Math.min(t.columns.length,5))*18)+(t.columns.length>5&&mode!=='simple'&&!expanded.has(t.name)?17:0)}};
function draw(){const svg=$('#canvas');if(!svg)return;const W=svg.clientWidth,H=svg.clientHeight;svg.setAttribute('viewBox',`0 0 ${W} ${H}`);let pos={};D.tables.forEach((t,i)=>{let lay=t.layout||{};pos[t.name]=positions[t.name]||{x:28+(lay.col??i%4)*280,y:30+(lay.row??Math.floor(i/4))*225}});let visible=new Set(D.tables.filter(t=>!search||t.name.toLowerCase().includes(search.toLowerCase())).map(t=>t.name));if($('#mode')?.value==='focus'&&selected){let neighbors=new Set([selected]);D.relationships.forEach(r=>{if(r.from===selected)neighbors.add(r.to);if(r.to===selected)neighbors.add(r.from)});visible=new Set([...visible].filter(n=>neighbors.has(n)))}let g=`<defs><marker id="crow" viewBox="0 -7 9 14" refX="8" refY="0" markerWidth="8" markerHeight="12" orient="auto-start-reverse"><path d="M0,-6 L8,0 L0,6 M0,0 L8,0" fill="none" stroke="#8492a8" stroke-width="1.3"/></marker><marker id="one" viewBox="0 -7 4 14" refX="2" refY="0" markerWidth="5" markerHeight="12" orient="auto"><path d="M2,-6 V6" fill="none" stroke="#8492a8" stroke-width="1.5"/></marker><marker id="zeroone" viewBox="0 -8 9 16" refX="8" refY="0" markerWidth="9" markerHeight="14" orient="auto"><circle cx="2" cy="0" r="2" fill="var(--panel)" stroke="#8492a8"/><path d="M7,-6 V6" fill="none" stroke="#8492a8" stroke-width="1.5"/></marker></defs><g id="zoomgroup" transform="translate(${pan.x} ${pan.y}) scale(${scale})">`;

function wireDrag(svg){let target=null,start=null,orig=null;svg.onpointerdown=e=>{let node=e.target.closest('.entity');if(node&&e.button===0&&!e.shiftKey){target=node.dataset.node;let p=positions[target];if(!p){let tr=node.getAttribute('transform').match(/translate\(([-\d.]+) ([-\d.]+)\)/);p={x:+tr[1],y:+tr[2]};positions[target]=p}orig={...p};start={x:e.clientX,y:e.clientY};svg.setPointerCapture(e.pointerId)}else if(e.shiftKey){target='pan';start={x:e.clientX,y:e.clientY};orig={...pan};svg.setPointerCapture(e.pointerId)}};svg.onpointermove=e=>{if(!target)return;let dx=(e.clientX-start.x)/scale,dy=(e.clientY-start.y)/scale;if(target==='pan')pan={x:orig.x+(e.clientX-start.x),y:orig.y+(e.clientY-start.y)};else positions[target]={x:orig.x+dx,y:orig.y+dy};draw()};svg.onpointerup=()=>{if(target!=='pan')try{localStorage.setItem('dbpos',JSON.stringify(positions))}catch{};target=null};svg.onwheel=e=>{e.preventDefault();scale=Math.max(.35,Math.min(2.2,scale*(e.deltaY<0?1.08:.92)));draw()}}
function selectNode(n){selected=n;edgeSel=null;draw();let t=D.tables.find(x=>x.name===n);$('#drawerBody').innerHTML=`<h2>${esc(n)}</h2><p>${t.columns.length} columnas · ${t.rowsInserted.toLocaleString()} tuplas INSERT</p><p><b>PK:</b> ${t.columns.filter(c=>c.pk).map(c=>esc(c.name)).join(', ')||'No identificada en definición inline'}</p><p><b>FK:</b> ${D.relationships.filter(r=>r.from===n).map(r=>esc(r.label)).join('; ')||'—'}</p><div class="pillrow"><button onclick="go('dictionary');openTable('${esc(n)}')">Diccionario</button><button onclick="go('triggers');$('#triggerTable').value='${esc(n)}';render()">Triggers</button></div><h3>Atributos</h3>${tableColumnHtml(t)}<h3>Restricciones / índices</h3><pre>${esc(t.constraints.join('\n')||'Sin restricciones adicionales')}</pre>`;$('#drawer').classList.add('open')}
function selectEdge(i){edgeSel=i;selected=null;draw();let r=D.relationships[i];$('#drawerBody').innerHTML=`<h2>Relación ${!r.explicit?'inferida':'FK'}</h2><p><b>Origen:</b> ${esc(r.from)}<br><b>Destino:</b> ${esc(r.to)}<br><b>Columnas:</b> ${esc(r.label||'No especificadas')}<br><b>Tipo:</b> ${r.fromCardinality||'muchos'} a ${r.toCardinality||'uno'}<br><b>Opcionalidad:</b> ${r.fromOptional?'origen opcional':'FK obligatoria (columna NOT NULL)'}<br><b>Cardinalidad:</b> ${r.fromCardinality==='many'?'0..N':'1'} → ${r.toCardinality==='one'?'1':'0..N'}<br><b>Acción referencial:</b> ${esc(r.actions||'NO ACTION (predeterminado por MySQL; no especificado en la FK)')}</p><span class="badge ${!r.explicit?'orange':'green'}">${relationClass(r)}</span><p class="muted">${!r.explicit?'Relación inferida por convención del modelo; no confirma restricción SQL.':'Relación marcada como explícita en el modelo EER de referencia.'}</p>`;$('#drawer').classList.add('open')}
function closeDrawer(){$('#drawer').classList.remove('open')}function toggleExpand(n){expanded.has(n)?expanded.delete(n):expanded.add(n);draw()}function zoom(k){scale=Math.max(.35,Math.min(2.2,scale*k));draw()}function fit(){scale=.72;pan={x:12,y:8};draw()}function resetPos(){positions={};try{localStorage.removeItem('dbpos')}catch{};fit()}function exportSvg(){let s=$('#canvas').cloneNode(true);s.setAttribute('xmlns','http://www.w3.org/2000/svg');let blob=new Blob([s.outerHTML],{type:'image/svg+xml'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='modelo-eer-db_test.svg';a.click();URL.revokeObjectURL(a.href)}function filterNodes(v){search=v;draw()}
function tableColumnHtml(t){return `<div class="tablewrap"><table><thead><tr><th>Columna</th><th>Tipo SQL</th><th>NULL</th><th>Default</th><th>Claves</th><th></th></tr></thead><tbody>${t.columns.map((c,i)=>`<tr><td>${esc(c.name)}</td><td><code>${esc(c.type)}</code></td><td>${c.nullable?'Sí':'No'}</td><td>${esc(c.default??'—')}</td><td>${c.pk?'<span class="badge">PK</span>':''}${c.auto?'<span class="badge green">AUTO</span>':''}</td><td><button onclick="navigator.clipboard?.writeText(${JSON.stringify(c.name)})">Copiar</button></td></tr>`).join('')}</tbody></table></div>`}
function dict(){let q=search.toLowerCase();let ts=D.tables.filter(t=>t.name.toLowerCase().includes(q)||t.columns.some(c=>c.name.toLowerCase().includes(q)));return `<h1>Diccionario de datos</h1><p class="sub">${ts.length} de ${D.tables.length} tablas · datos estructurales sin valores de filas.</p><div class="toolbar"><input placeholder="Filtrar tablas o columnas" value="${esc(search)}" oninput="search=this.value;render()"><select onchange="sortTables(this.value)"><option value="name">Nombre</option><option value="columns">Columnas</option><option value="rows">Tuplas INSERT</option></select></div><div class="grid twocol">${ts.map(t=>`<section class="panel" id="t-${t.name}"><div style="display:flex;justify-content:space-between"><h2>${esc(t.name)}</h2><span class="badge">${t.columns.length} columnas</span></div><p class="muted">${t.rowsInserted.toLocaleString()} tuplas INSERT en dump · ${t.constraints.length} definiciones de índices/restricciones</p><p><b>PK:</b> ${t.columns.filter(c=>c.pk).map(c=>esc(c.name)).join(', ')||'ver definición SQL'} · <b>FK vinculadas:</b> ${D.relationships.filter(r=>r.from===t.name||r.to===t.name).length}</p><details><summary>Ver columnas y definiciones</summary>${tableColumnHtml(t)}<details><summary>SQL CREATE TABLE</summary><pre>${esc(t.sql)}</pre></details></details></section>`).join('')||'<div class="empty">Sin coincidencias.</div>'}</div>`}
function openTable(n){document.getElementById('t-'+CSS.escape(n))?.scrollIntoView({behavior:'smooth'})}
function rels(){return `<h1>Relaciones y trazabilidad</h1><p class="sub">Relaciones obtenidas del modelo EER; se distingue la evidencia inferida.</p><div class="toolbar"><select id="relfilter" onchange="filterRel(this.value)"><option value="all">Todas</option><option value="explicit">FK explícitas</option><option value="inferred">Inferidas</option></select></div><div id="relrows" class="list">${D.relationships.map((r,i)=>`<div class="item relitem" data-kind="${!r.explicit?'inferred':'explicit'}" onclick="selectEdge(${i})"><b>${esc(r.from)} → ${esc(r.to)}</b><span class="badge ${!r.explicit?'orange':'green'}">${relationClass(r)}</span><p class="muted">${esc(r.label||'Columnas no detalladas')} · ${r.fromCardinality||'muchos'} : ${r.toCardinality||'uno'}</p></div>`).join('')}</div>`}
function filterRel(v){document.querySelectorAll('.relitem').forEach(x=>x.classList.toggle('hide',v!=='all'&&x.dataset.kind!==v))}
function trigs(){let q=search.toLowerCase(),a=D.triggers.filter(t=>(t.name+t.table+t.event+t.timing+t.sql).toLowerCase().includes(q)),tab=$('#triggerTable')?.value||'';if(tab)a=a.filter(t=>t.table===tab);return `<h1>Triggers</h1><p class="sub">${a.length} de ${D.triggers.length} definiciones. Código del respaldo; cláusulas DEFINER excluidas.</p><div class="toolbar"><select id="triggerTable" onchange="render()"><option value="">Todas las tablas</option>${D.tables.map(t=>`<option ${tab===t.name?'selected':''}>${esc(t.name)}</option>`).join('')}</select><select id="triggerEvent" onchange="filterTriggers()"><option value="all">Todos los eventos</option><option>INSERT</option><option>UPDATE</option><option>DELETE</option></select><select id="triggerTime" onchange="filterTriggers()"><option value="all">BEFORE y AFTER</option><option>BEFORE</option><option>AFTER</option></select></div><div class="grid twocol">${a.map((t,i)=>`<section class="panel trigitem" data-event="${t.event}" data-time="${t.timing}"><h2>${esc(t.name)}</h2><p><span class="badge">${esc(t.timing)} ${esc(t.event)}</span><span class="badge green">${esc(t.table)}</span></p><p class="muted">Ejecución: ${esc(t.timing)} ${esc(t.event)} por fila. Las operaciones y tablas afectadas se consultan en el SQL.</p><details><summary>Definición SQL (${t.sql.split('\n').length} líneas)</summary><button onclick="navigator.clipboard?.writeText(${JSON.stringify(t.sql)})">Copiar SQL</button><pre>${esc(t.sql)}</pre></details><button onclick="go('eer');selectNode('${esc(t.table)}')">Abrir tabla en EER</button></section>`).join('')}</div>`}
function filterTriggers(){let e=$('#triggerEvent')?.value||'all',t=$('#triggerTime')?.value||'all';document.querySelectorAll('.trigitem').forEach(x=>x.classList.toggle('hide',(e!=='all'&&x.dataset.event!==e)||(t!=='all'&&x.dataset.time!==t)))}
function views(){let found=D.views.filter(v=>v.name.toLowerCase().includes(search.toLowerCase()));return `<h1>Vistas</h1><p class="sub">${found.length} de ${D.views.length} objetos registrados en el respaldo.</p><div class="panel"><b>Limitación del respaldo:</b> las definiciones encontradas son stubs de metadatos con nombres de columnas de salida, no incluyen SELECT/FROM ni dependencias. No se inventaron consultas ni fuentes.</div><div class="grid threecol">${found.map(v=>`<section class="panel"><h3>${esc(v.name)}</h3><span class="badge orange">SQL incompleto en dump</span><details><summary>Stub disponible</summary><pre>${esc(v.sql)}</pre></details></section>`).join('')}</div></div>`}
function objects(){let all=D.tables.flatMap(t=>t.constraints.map(c=>({table:t.name,sql:c})));return `<h1>Índices, restricciones y rutinas</h1><p class="sub">Índices y constraints extraídos de CREATE TABLE; ${D.routines.length} rutinas almacenadas encontradas.</p><h2>Restricciones e índices (${all.length})</h2><div class="grid twocol">${all.map(x=>`<div class="item"><b>${esc(x.table)}</b><pre>${esc(x.sql)}</pre></div>`).join('')}</div><h2>Procedimientos y funciones</h2><div class="grid twocol">${D.routines.filter(x=>(x.name+' '+x.kind).toLowerCase().includes(search.toLowerCase())).map(x=>`<section class="panel"><h3>${esc(x.kind)} · ${esc(x.name)}</h3><details><summary>Ver SQL</summary><pre>${esc(x.sql)}</pre></details><button onclick="navigator.clipboard?.writeText(${JSON.stringify(x.sql)})">Copiar SQL</button></section>`).join('')}</div>`}
function records(){return `<h1>Registros en el respaldo</h1><p class="sub">Conteo de tuplas INSERT halladas; no representa estado actual ni total final después de otras operaciones SQL.</p><div class="panel"><b>Metodología:</b> recorrido lexical de sentencias INSERT dirigidas a tablas físicas; conteo de grupos de valores entre paréntesis respetando cadenas y escapes. Se omitieron valores de todas las filas. Debido a operaciones de actualización/eliminación y a la discrepancia con la referencia, no se declara conteo final exacto.</div><div class="tablewrap"><table><thead><tr><th>Tabla</th><th>Tuplas INSERT</th><th>Estado de conteo final</th></tr></thead><tbody>${D.tables.slice().sort((a,b)=>b.rowsInserted-a.rowsInserted).map(t=>`<tr><td>${esc(t.name)}</td><td>${t.rowsInserted.toLocaleString()}</td><td><span class="badge orange">No determinable como estado final</span></td></tr>`).join('')}</tbody></table></div><p>Total de tuplas insert descritas: <b>${D.tables.reduce((s,t)=>s+t.rowsInserted,0).toLocaleString()}</b>. El ER de referencia indica 91,703 filas (diferencia observada: 6).</p>`}
function about(){return `<h1>Metodología, seguridad y limitaciones</h1><p class="sub">Trazabilidad documental y alcance de la extracción.</p><div class="panel"><h2>Seguridad y privacidad</h2><p>El respaldo contiene la columna estructural <code>tb_users.password</code>, sentencias que generan hashes y registros con correos, nombres, fechas y otros datos personales. No se incrustaron instrucciones INSERT ni valores de registros; tampoco se exponen hashes. Se removieron cláusulas DEFINER de los fragmentos de rutinas y triggers. Las columnas y sus tipos se conservan porque forman parte del diccionario.</p><p>Se detectó el uso de MD5 y SHA2 en lógica de creación de cuentas; se documentan como expresiones del SQL sin divulgar credenciales.</p></div><div class="panel"><h2>Validación</h2><ul><li>SQL fuente: ${esc(D.source)} (${D.database}).</li><li>25 tablas, ${ncols} columnas, 72 triggers, 28 stubs de vistas.</li><li>${D.relationships.length} conexiones heredadas del modelo EER de referencia; inferencias con línea punteada.</li><li>7 rutinas almacenadas (4 funciones y 3 procedimientos).</li><li>El dump contiene DDL, DML y operaciones que hacen que INSERT tuples no equivalga a estado final de filas.</li><li>El stub de vista incluye nombres de columnas proyectadas; su SELECT y dependencias no están disponibles.</li></ul></div><div class="panel"><h2>Controles de uso</h2><p>Busca en el campo superior para localizar tablas, columnas, triggers y vistas. Usa tema claro/oscuro, impresión del navegador, filtros por objeto, y el lienzo EER para explorar relaciones. Las posiciones EER se conservan en localStorage.</p><p>Generado el 6 de noviembre de 2026 · documento autónomo, datos estructurales embebidos, sin dependencias CDN ni fetch local.</p></div>`}
function globalMatches(q){if(!q)return[];q=q.toLowerCase();let a=[];D.tables.forEach(t=>{if(t.name.toLowerCase().includes(q))a.push(['Tabla',t.name,'dictionary',t.name]);t.columns.forEach(c=>{if(c.name.toLowerCase().includes(q))a.push(['Columna',c.name+' · '+t.name,'dictionary',t.name])});t.constraints.forEach(c=>{if(c.toLowerCase().includes(q))a.push(['Índice/restricción',t.name+' · '+c,'dictionary',t.name])})});D.triggers.forEach(t=>{if(t.name.toLowerCase().includes(q)||t.table.toLowerCase().includes(q))a.push(['Trigger',t.name,'triggers',t.name])});D.views.forEach(v=>{if(v.name.toLowerCase().includes(q))a.push(['Vista',v.name,'views',v.name])});D.relationships.forEach(r=>{if((r.id+' '+r.from+' '+r.to+' '+r.label).toLowerCase().includes(q))a.push(['Relación',r.from+' → '+r.to+' · '+r.label,'relations',r.id])});D.routines.forEach(r=>{if((r.kind+' '+r.name).toLowerCase().includes(q))a.push(['Rutina',r.kind+' · '+r.name,'objects',r.name])});return a.slice(0,40)}
$('#globalSearch').addEventListener('input',e=>{search=e.target.value;let found=globalMatches(search);$('#searchResults').innerHTML=found.map(x=>`<button class="search-result" role="option" data-page="${x[2]}" data-key="${esc(x[3])}"><span class="badge">${x[0]}</span><span>${esc(x[1])}</span></button>`).join('')|| (search?'<div class="empty">Sin coincidencias en objetos del esquema.</div>':'');$('#searchResults').classList.toggle('open',!!search);if(page==='eer')draw();else render()});$('#searchResults').addEventListener('click',e=>{let b=e.target.closest('.search-result');if(!b)return;let p=b.dataset.page,k=b.dataset.key;$('#searchResults').classList.remove('open');$('#globalSearch').value='';search='';go(p);if(p==='dictionary')openTable(k);else if(p==='triggers'){search=k;render();document.querySelector('.trigitem')?.scrollIntoView({behavior:'smooth'})}else if(p==='views'){search=k;render()}else if(p==='relations'){let i=D.relationships.findIndex(r=>r.id===k);if(i>=0)selectEdge(i)}else if(p==='objects'){search=k;render()}});document.addEventListener('click',e=>{if(!e.target.closest('#searchResults')&&!e.target.closest('#globalSearch'))$('#searchResults').classList.remove('open')});$('#theme').onclick=()=>{let v=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=v;try{localStorage.setItem('dbtheme',v)}catch{};if(page==='eer')draw()};try{document.documentElement.dataset.theme=localStorage.getItem('dbtheme')||'light'}catch{};function sortTables(v){D.tables.sort((a,b)=>v==='columns'?b.columns.length-a.columns.length:v==='rows'?b.rowsInserted-a.rowsInserted:a.name.localeCompare(b.name));render()}render();
window.addEventListener('beforeprint',()=>{window.__printPage=page;window.__printSearch=search;search='';let sections=[];pages.forEach(([id])=>{page=id;render();sections.push('<section class=\"print-section\">'+$('#content').innerHTML+'</section>')});$('#content').innerHTML=sections.join('');page='print'});window.addEventListener('afterprint',()=>{page=window.__printPage||'home';search=window.__printSearch||'';render()});</script></body></html>
