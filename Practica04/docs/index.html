}

function colDescription(t,c){
  if(COL_SEM[c.name]) return COL_SEM[c.name](c);
  if(c.isPK && c.name==='ID') return COL_SEM.ID(c);
  if(c.name.endsWith('_ID')) return `Clave foránea que referencia ${c.name.replace(/_ID$/,'')} y vincula este registro con esa entidad.`;
  return `Atributo ${c.name.replace(/_/g,' ')} de ${entityLabel(t)}; representa ${c.name.includes('date')?'una fecha o momento':'un valor de negocio'} registrado en el proceso.`;
}
function domainOf(c,t){
  const ty=c.sqlType, bits=[];
  bits.push(`Tipo SQL: ${c.fullType}`);
  if(ty==='ENUM'||ty==='SET') bits.push(`${ty==='ENUM'?'Selección única':'Selección múltiple'} de: ${c.enumValues.map(v=>`[${v}]`).join(' · ')}`);
  else if(TYPE_RANGE[ty]) bits.push(`Rango por tipo: ${TYPE_RANGE[ty]}`);
  else if(ty==='DECIMAL'||ty==='NUMERIC') bits.push(`Precisión ${c.precision}, escala ${c.scale}; magnitud máxima ±(10^${c.precision-c.scale} − 10^-${c.scale}). almacenamiento exacto.`);
  else if(ty==='VARCHAR') bits.push(`Longitud declarada 0..${c.length} caracteres (sin mínimo declarado; MySQL no impone uno).`);
  else if(ty==='CHAR') bits.push(`Longitud fija ${c.length} caracteres.`);
  else if(ty==='TEXT') bits.push('Texto variable de hasta 65,535 bytes; sin mínimo declarado.');
  else if(ty==='DATETIME') bits.push('Formato YYYY-MM-DD HH:MM:SS, rango 1000-01-01 a 9999-12-31.');
  else if(ty==='DATE') bits.push('Formato YYYY-MM-DD, rango 1000-01-01 a 9999-12-31.');
  else if(ty==='BIT') bits.push('Un bit: [0 | 1], interpretable como falso/verdadero.');
  if(c.defaultValue!==null) bits.push(`Default declarado: ${c.defaultValue}.`);
  if(c.onUpdate) bits.push('ON UPDATE CURRENT_TIMESTAMP: valor derivado en cada actualización.');
  if(c.autoIncrement) bits.push('Generación automática por AUTO_INCREMENT.');
  bits.push(`Nulabilidad: ${c.nullable?'NULL permitido':'NOT NULL'}.`);
  if(c.isFK){
    const fk=t.fks.find(f=>f.columns.includes(c.name));
    if(fk) bits.push(`Dominio referenciado: ${fk.table}.${fk.refColumns[fk.columns.indexOf(c.name)]} (FK confirmada).`);
  }
  const ck=t.checks.find(k=>new RegExp('`?'+c.name+'`?','i').test(k.expression));
  if(ck) bits.push(`CHECK confirmado: ${ck.expression}.`);
  return bits.join(' ');
}
function natureOf(c){
  const n=c.name.toLowerCase(), ty=c.sqlType;
  if(c.isPK || /(_id$|^id$|person_id)/.test(n)) return {value:'Cualitativa nominal (identificador)',why:'Un identificador numérico etiqueta entidades; no es una magnitud medible, aunque use INT.'};
  if(ty==='BIT') return {value:'Cualitativa nominal (booleana)',why:'Dos categorías sin orden cuantitativo; 1/0 codifican estado.'};
  if(ty==='ENUM') return {value:'Cualitativa nominal',why:'Alternativas categóricas declaradas; el DDL no define una regla de orden entre ellas.'};
  if(ty==='DATETIME'||ty==='DATE'||n.includes('date')) return {value:'Cuantitativa continua (tiempo)',why:'El tiempo se mide en una escala continua, con precisión de fecha/hora según el tipo.'};
  if(/latitude|longitude/.test(n)) return {value:'Cuantitativa continua (coordenada)',why:' representa una magnitud geográfica susceptible de valores intermedios.'};
  if(/amount|price|cost|subtotal|money/.test(n)&&ty==='DECIMAL') return {value:'Cuantitativa discreta (magnitud monetaria)',why:'Cantidad de dinero con precisión decimal fija declarada; se modela como magnitud con escala.'};
  if(ty==='INT'||ty==='BIGINT'||ty==='TINYINT'||ty==='SMALLINT') return {value:'Cuantitativa discreta',why:'Valores enteros contables (conteo o cantidad) cuando no actúan como identificador.'};
  if(ty==='DECIMAL') return {value:'Cuantitativa continua (precisión decimal)',why:'Valor numérico con precisión y escala declaradas.'};
  return {value:'Cualitativa nominal',why:'Texto descriptivo sin orden natural declarado en el esquema.'};
}
function classifyOf(c){
  const dims=[];
  dims.push(['Extensión', c.sqlType==='SET'?'Compuesto (SET permite varios valores)':'Simple (un solo valor atómico en el modelo físico)']);
  dims.push(['Cardinalidad', c.sqlType==='SET'?'Multivaluado':'Monovaluado']);
  dims.push(['Origen', c.autoIncrement||c.onUpdate?'Derivado/generado por MySQL':'Almacenado']);
  dims.push(['Obligatoriedad', c.nullable?'Opcional (NULL permitido)':'Obligatorio (NOT NULL)']);
  dims.push(['Rol', c.isPK||(c.name==='ID'&&!c.isPK)?'Identificador':'No identificador']);
  return dims;
}
function dfdColumn(c,t){
  const ty=c.sqlType;
  let expr;
  if(ty==='ENUM'||ty==='SET') expr=`${c.name} = ${ty==='ENUM'?'[':'{'}${c.enumValues.join(' | ')}${ty==='ENUM'?']':'}'}`;
  else if(TYPE_RANGE[ty]) expr=`${c.name} = {digito} * ${c.unsigned?'UNSIGNED':'SIGNED'}; ${TYPE_RANGE[ty]} *`;
  else if(ty==='DECIMAL') expr=`${c.name} = {digito} * DECIMAL(${c.precision},${c.scale}); ${c.scale} decimales *`;
  else if(ty==='VARCHAR') expr=`${c.name} = 0{caracter}${c.length} * VARCHAR(${c.length}); sin mínimo declarado *`;
  else if(ty==='CHAR') expr=`${c.name} = ${c.length}{caracter}${c.length} * CHAR(${c.length}) *`;
  else if(ty==='TEXT') expr=`${c.name} = 0{caracter}65535 * TEXT; hasta 65,535 bytes *`;
  else if(ty==='DATETIME') expr=`${c.name} = fecha_hora * YYYY-MM-DD HH:MM:SS *`;
  else if(ty==='DATE') expr=`${c.name} = fecha * YYYY-MM-DD *`;
  else if(ty==='BIT') expr=`${c.name} = [0 | 1]`;
  else expr=`${c.name} = {valor} * ${c.fullType} *`;
  const tags=[];
  if(c.isPK) tags.push('PK');
  if(c.isFK) tags.push('FK');
  if(c.isUnique) tags.push('UNIQUE');
  if(!c.nullable) tags.push('NOT NULL');
  if(c.autoIncrement) tags.push('AUTO_INCREMENT');
  if(c.defaultValue!==null) tags.push('DEFAULT '+c.defaultValue);
  if(c.onUpdate) tags.push('ON UPDATE CURRENT_TIMESTAMP');
  return expr+`\n  * ${tags.join(' · ')||'sin restricciones adicionales'} *`;
}
function dfdTable(t){
  const lines=t.columns.map(c=>{
    const key=c.isPK?'@':'';
    const tags=[];
    if(c.isPK) tags.push('PK'+(t.pk.length>1?' compuesta':''));
    if(c.isFK){const fk=t.fks.find(f=>f.columns.includes(c.name)); tags.push('FK → '+fk.table+'.'+fk.refColumns[fk.columns.indexOf(c.name)]);}
    if(c.isUnique) tags.push('UNIQUE');
    return `  ${key}${c.name}${c.nullable&&!c.isPK?' (opcional)':''}${tags.length?' * '+tags.join(' · ')+' *':''}`;
  });
  return `${t.name} = {\n${lines.join(' +\n')}\n}`;
}
function evidenceOf(c,t){
  const ev=['DDL confirmado: tipo, nulabilidad'+(c.defaultValue!==null?', valor predeterminado':'')+(c.isPK?', clave primaria':'')+(c.isFK?', clave foránea':'')+(c.isUnique?', unicidad':'')+(c.autoIncrement?', AUTO_INCREMENT':'')+(c.onUpdate?', ON UPDATE CURRENT_TIMESTAMP':''),'Inferido: descripción funcional y naturaleza semántica (basada en nombre, tipo y relaciones).'];
  if(/password|hash|token|secret/i.test(c.name)) ev.push('No determinable: algoritmo, longitud real del valor almacenado y contenido. Los valores quedan excluidos del atlas.');
  else if(c.sqlType==='VARCHAR') ev.push('No determinable: contenido mínimo y formato interno no declarados en el DDL.');
  else ev.push('No determinable: reglas de negocio no expresadas en DDL, CHECK ni trigger.');
  return ev.join('. ')+'.';
}

const PALETTE=['#0f766e','#34d399','#7c3aed','#0f9d72','#c77d09','#d63b4a','#0891b2','#9333ea','#65a30d','#e11d48'];
function barChart(rows,{color='#0f766e',max=10,unit='',labelWidth=118}={}){

function donutChart(rows,{title=''}={}){
  const data=rows.filter(d=>d.v>0); if(!data.length) return '<div class="empty small">Sin datos.</div>';
  const total=data.reduce((a,b)=>a+b.v,0), cx=90,cy=90,r=62,ir=38;
  let acc=0; const arcs=data.map((d,i)=>{
    const a0=acc/total*Math.PI*2-Math.PI/2; acc+=d.v; const a1=acc/total*Math.PI*2-Math.PI/2;
    const large=(a1-a0)>Math.PI?1:0;
    const p=(rad,a)=>`${(cx+rad*Math.cos(a)).toFixed(2)},${(cy+rad*Math.sin(a)).toFixed(2)}`;
    return `<path d="M ${p(r,a0)} A ${r},${r} 0 ${large} 1 ${p(r,a1)} L ${p(ir,a1)} A ${ir},${ir} 0 ${large} 0 ${p(ir,a0)} Z" fill="${d.c||PALETTE[i%PALETTE.length]}"><title>${esc(d.k)}: ${fmt(d.v)} (${(d.v/total*100).toFixed(1)}%)</title></path>`;
  }).join('');
  const legend=data.map((d,i)=>`<div style="display:flex;gap:6px;align-items:center;font-size:10.5px;margin:3px 0"><span style="width:9px;height:9px;border-radius:2px;background:${d.c||PALETTE[i%PALETTE.length]}"></span><span style="flex:1">${esc(d.k)}</span><b>${fmt(d.v)}</b></div>`).join('');
  return `<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 180 180" style="width:150px;flex:0 0 150px" role="img">${arcs}<text x="90" y="86" text-anchor="middle" font-size="19" font-weight="800" fill="var(--text)">${fmt(total)}</text><text x="90" y="102" text-anchor="middle" font-size="9" fill="var(--muted)">${esc(title)}</text></svg><div style="flex:1;min-width:150px">${legend}</div></div>`;
}

let SEARCH_INDEX=[];
function buildSearchIndex(){
  const add=(kind,name,sub,sec,fn)=>SEARCH_INDEX.push({kind,name,sub,sec,fn});
  T.forEach(t=>add('Tabla',t.name,`${t.columns.length} columnas · ${fmt(t.rowCount)} registros`,'tablas',`openTable('${t.name}')`));
  T.forEach(t=>t.columns.forEach(c=>add('Columna',`${t.name}.${c.name}`,c.fullType,'diccionario',`openColumn('${t.name}','${c.name}')`)));
  TR.forEach(t=>add('Trigger',t.name,`${t.timing} ${t.event} · ${t.table}`,'triggers',`openTrigger('${t.name}')`));
  V.forEach(v=>add('Vista',v.name,`${v.tables.length} tablas · ${v.resultColumns.length} columnas`,'vistas',`openView('${v.name}')`));
  R.forEach(r=>add('Relación',r.name,`${r.fromTable} → ${r.toTable}`,'relaciones',`openRelationship('${r.id}')`));
  T.forEach(t=>t.indexes.forEach(i=>add('Índice',`${t.name}.${i.name}`,`${i.columns.join(', ')} · ${i.unique?'UNIQUE':'BTREE'}`,'indices',`scrollToIndex('${t.name}','${i.name}')`)));
  T.forEach(t=>t.checks.forEach(c=>add('CHECK',`${t.name}.${c.name}`,c.expression.slice(0,70),'indices',`scrollToIndex('${t.name}','${c.name}')`)));
  DATA.procedures.forEach(p=>add('Procedimiento',p.name,'','exportacion',''));
  DATA.functions.forEach(f=>add('Función',f.name,'','exportacion',''));
}

function highlightSQL(code){
  let s=esc(code);
  s=s.replace(/(\/\*[\s\S]*?\*\/|--[^\n]*)/g,'<span class="cm">$1</span>');
  s=s.replace(/('(?:[^'\\]|\\.|'')*')/g,'<span class="str">$1</span>');
  s=s.replace(/\b(CREATE|TABLE|VIEW|TRIGGER|PROCEDURE|FUNCTION|ALTER|INSERT|UPDATE|DELETE|SELECT|FROM|WHERE|AND|OR|NOT|NULL|IS|IN|AS|ON|JOIN|LEFT|RIGHT|INNER|OUTER|GROUP|BY|ORDER|HAVING|LIMIT|BEGIN|END|IF|THEN|ELSE|CASE|WHEN|SET|DECLARE|DEFAULT|PRIMARY|KEY|FOREIGN|REFERENCES|UNIQUE|CHECK|CONSTRAINT|AFTER|BEFORE|FOR|EACH|ROW|USING|DISTINCT|UNION|ALL|VALUES|INTO|CURRENT_TIMESTAMP|AUTO_INCREMENT|CASCADE|RESTRICT|BIT|INT|DECIMAL|VARCHAR|CHAR|TEXT|DATETIME|DATE|ENUM|TINYINT|BIGINT)\b/g,'<span class="kw">$1</span>');
  s=s.replace(/\b(USER|CONCAT|SUBSTRING|SUBSTRING_INDEX|COALESCE|GROUP_CONCAT|CAST|COUNT|SUM|MAX|MIN|NOW|DATE_FORMAT|IFNULL|SIGNAL|ROW_COUNT)\b(?=\s*\()/g,'<span class="fn">$1</span>');
  s=s.replace(/\b(\d+(?:\.\d+)?)\b/g,'<span class="num">$1</span>');
  return s;
}
function codeBlock(code,id,extra=''){
  const lines=code.replace(/\r/g,'').split('\n');
  return `<div class="code-block" data-code-id="${esc(id)}"><div class="code-head"><span class="mono">${esc(id)}</span><span class="sp"></span>${extra}<button onclick="copyText(this.closest('.code-block').querySelector('.code-body').dataset.raw,'Código SQL')">Copiar</button></div><div class="code-body" data-raw="${esc(code)}">${lines.map((l,i)=>`<div class="code-line"><span class="ln">${i+1}</span><span class="lc">${highlightSQL(l)||'&nbsp;'}</span></div>`).join('')}</div></div>`;
}
function triggerDesc(tr){
  const tgt=(tr.affectedTables||[]).filter(x=>x!==tr.table);
  const base=`Se dispara ${tr.timing.toLowerCase()} de una operación ${tr.event.toLowerCase()} sobre ${tr.table}; para cada fila afectada, `;
  const ops=(tr.operations||[]).map(o=>o.toLowerCase()).join(', ')||'insertar';
  return base+(tgt.length?`${ops} y registra información en ${tgt.slice(0,3).join(', ')}.`:`${ops} información de auditoría o ajusta el estado del propio registro.`)+
   ` El código original es la evidencia confirmada; esta redacción es una interpretación técnica inferida.`;
}
function viewDesc(v){
  const ext=v.external.length?` Incluye dependencias externas (${v.external.join(', ')}), que no son tablas propias del esquema.`:'';
  return `Vista definida sobre ${v.tables.length?v.tables.join(', '):'expresiones constantes'}${v.views.length?', además de '+v.views.join(', '):''}. Devuelve ${v.resultColumns.length} columnas${v.filters?' y aplica un filtro WHERE sobre el origen':''}.${ext} Descripción inferida del SQL.`;
}

  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-height:260px">${lines}${nodes.map(n=>`<g><rect x="${pos[n].x}" y="${pos[n].y}" width="130" height="34" rx="6" fill="var(--surface-2)" stroke="var(--border-strong)"/><text x="${pos[n].x+65}" y="${pos[n].y+21}" text-anchor="middle" font-size="9" font-family="monospace" fill="var(--text)">${esc(n)}</text></g>`).join('')}</svg>`;
}

  <div class="grid g2"><div class="card pad"><h3 style="font-size:13px;margin:0 0 10px">Restricciones CHECK (${cks.length})</h3><div class="table-scroll" style="max-height:440px"><table class="data-table"><thead><tr><th>Tabla</th><th>Restricción</th><th>Expresión</th></tr></thead><tbody>${cks.map(({t,c})=>`<tr id="idx-${CSS.escape(t.name)}-${CSS.escape(c.name)}"><td class="mono">${esc(t.name)}</td><td class="mono">${esc(c.name)}</td><td class="mono small">${esc(c.expression)}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">Sin resultados.</td></tr>'}</tbody></table></div></div>
  <div class="card pad"><h3 style="font-size:13px;margin:0 0 10px">Claves primarias y foráneas</h3><div class="table-scroll" style="max-height:440px"><table class="data-table"><thead><tr><th>Tabla</th><th>PK</th><th>FK</th><th>Detalle FK</th></tr></thead><tbody>${T.filter(t=>(t.name+' '+t.pk.join()+' '+t.fks.map(f=>f.name).join()).toLowerCase().includes(q)).map(t=>`<tr><td class="mono">${esc(t.name)}</td><td class="mono">${esc(t.pk.join(', '))}</td><td>${t.fks.length}</td><td class="small">${t.fks.map(f=>esc(f.name)+' → '+esc(f.table)).join('<br>')||'—'}</td></tr>`).join('')}</tbody></table></div></div></div>`;

/* ============================================================

function renderRegistros(){
  const rows=[...T].sort((a,b)=>b.rowCount-a.rowCount);
  const sum=S.totalRows;
  $('#sec-registros').innerHTML=secHead(12,'Registros y estadísticas',`Conteo de filas presentes en el respaldo, no en un servidor activo. Metodología: ${esc(S.rowMethod)}`)+
  `<div class="grid g4" style="margin-bottom:16px"><div class="card pad"><div class="small muted">Total verificable</div><div style="font-size:28px;font-weight:800">${fmt(sum)}</div><div class="small muted">filas en ${T.length} tablas</div></div><div class="card pad"><div class="small muted">Clasificación</div><div style="font-weight:800;color:var(--ok)">Conteo exacto verificable</div><div class="small muted">${S.rowStatus==='exacto'?'Sin modificadores de datos a nivel superior':'Revisar modificadores'}</div></div><div class="card pad"><div class="small muted">Sentencias INSERT</div><div style="font-size:28px;font-weight:800">${fmt(Object.values(S.insertsPerTable).reduce((a,b)=>a+b,0))}</div><div class="small muted">inserciones múltiples contabilizadas por tuplas</div></div><div class="card pad"><div class="small muted">Tabla con más filas</div><div style="font-weight:800" class="mono">${esc(rows[0].name)}</div><div class="small muted">${fmt(rows[0].rowCount)} filas (${Math.round(rows[0].rowCount/sum*100)}% del total)</div></div></div>
  <div class="grid g2" style="margin-bottom:16px"><div class="card pad"><h3 style="font-size:13px;margin:0 0 10px">Distribución de registros</h3>${barChart(rows.map(t=>({k:t.name.replace(/^t[bdc]_/,''),v:t.rowCount})),{max:14,labelWidth:150})}</div>
  <div class="card pad"><h3 style="font-size:13px;margin:0 0 10px">Nota metodológica</h3><div class="small"><p>Se contabilizan las <b>tuplas dentro de VALUES</b>, no el número de instrucciones INSERT. El analizador respeta comillas simples/dobles, escapes con barra invertida, comillas duplicadas y paréntesis anidados.</p><p>Las operaciones dentro de los cuerpos de los ${TR.length} triggers <b>no</b> se ejecutan en el respaldo y por tanto no alteran este conteo.</p><p>No se afirma que estos sean datos actuales de un servidor MySQL en ejecución: corresponden al contenido de <b>${esc(DATA.meta.source)}</b>, finalizado el ${esc(DATA.meta.dumpCompleted||'—')}.</p><p>No se embebieron valores de filas en el HTML: sólo conteos, estructura y estadísticas anonimizadas.</p></div></div></div>
  <div class="table-scroll"><table class="data-table"><thead><tr><th>Tabla</th><th>Filas verificables</th><th>Sentencias INSERT</th><th>Porcentaje</th><th>Conteo exacto por tabla</th></tr></thead><tbody>${rows.map(t=>`<tr style="cursor:pointer" onclick="openTable('${t.name}')"><td class="mono">${esc(t.name)}</td><td><b>${fmt(t.rowCount)}</b></td><td>${t.insertStatements}</td><td>${(t.rowCount/sum*100).toFixed(2)}%</td><td><div class="progress" style="width:120px"><i style="width:${t.rowCount/rows[0].rowCount*100}%"></i></div></td></tr>`).join('')}</tbody></table></div>`;
}

let depState={type:'all'};
function renderDependencias(){
  const kinds=[
    {k:'Tablas de auditoría',n:1,detail:'tb_logs concentra la bitácora; ${n} tabla de auditoría.'},
    {k:'Triggers → tb_logs',n:TR.filter(t=>(t.affectedTables||[]).includes('tb_logs')).length,detail:'Triggers que escriben en la bitácora.'},
    {k:'Triggers → vistas',n:TR.filter(t=>(t.affectedTables||[]).some(x=>x.startsWith('vw_')||x.startsWith('tb_'))).length,detail:'Triggers con tablas o vistas destino.'},
    {k:'Vistas → tablas propias',n:V.reduce((a,v)=>a+v.tables.length,0),detail:'Enlaces vista-tabla declarados en SQL.'},
    {k:'Vistas → dependencias externas',n:V.reduce((a,v)=>a+v.external.length,0),detail:'mysql.role_edges y otras tablas de sistema.'},
    {k:'Vistas → vistas',n:V.reduce((a,v)=>a+v.views.length,0),detail:'Enlaces entre vistas.'},
    {k:'FK confirmadas',n:R.length,detail:'Restricciones referenciales del DDL.'}
  ];
  const ext=[...new Set(V.flatMap(v=>v.external))];
  $('#sec-dependencias').innerHTML=secHead(13,'Dependencias y trazabilidad',`Mapa de objetos que participan en la auditoría: tablas, ${TR.length} triggers, ${V.length} vistas y dependencias externas al esquema.`)+
  `<div class="grid g4" style="margin-bottom:16px">${kinds.map(k=>`<div class="card pad"><div class="small muted">${esc(k.k)}</div><div style="font-size:25px;font-weight:800">${k.n}</div><div class="small muted">${esc(k.detail)}</div></div>`).join('')}</div>
  <div class="grid g2"><div class="card pad"><h3 style="font-size:13px;margin:0 0 10px">Cadena de trazabilidad documentada</h3>
  <div class="flow"><span>Operación SQL sobre tabla</span><i>→</i><span>Trigger BEFORE/AFTER</span><i>→</i><span>INSERT en tb_logs o vista</span><i>→</i><span>Vistas vw_trazabilidad_*</span></div>
  <div class="note" style="margin-top:14px">Los triggers insertan descripciones con USER(), valores NEW/OLD y marcas de estado. Las vistas de trazabilidad filtran <span class="mono">tb_logs</span> por <span class="mono">table_name</span> y, en algunos casos, consultan <span class="mono">mysql.role_edges</span> para mostrar roles. Estas tablas de sistema se representan como <b>dependencias externas</b>, no como tablas físicas propias.</div></div>
  <div class="card pad"><h3 style="font-size:13px;margin:0 0 10px">Dependencias externas detectadas</h3>${ext.length?ext.map(x=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)"><span class="mono">${esc(x)}</span><span class="chip warn">Externa</span></div>`).join(''):'<div class="empty small">Sin dependencias externas.</div>'}
  <div class="divider"></div><h3 style="font-size:13px;margin:0 0 8px">Objetos de auditoría</h3><button class="btn sm" onclick="navigate('tablas');openTable('tb_logs')">Abrir tb_logs</button> <button class="btn sm" onclick="navigate('vistas',{filter:'tb_logs'})">Vistas sobre tb_logs</button></div></div>
  <div class="card pad" style="margin-top:16px"><h3 style="font-size:13px;margin:0 0 10px">Relación trigger → tabla → vista (muestra documentada)</h3><div class="table-scroll" style="max-height:420px"><table class="data-table"><thead><tr><th>Trigger</th><th>Tabla origen</th><th>Tablas/vistas afectadas</th><th>Vistas dependientes de la tabla</th></tr></thead><tbody>${TR.slice(0,40).map(t=>`<tr><td class="mono">${esc(t.name)}</td><td class="mono">${esc(t.table)}</td><td class="mono">${(t.affectedTables||[]).join(', ')||'—'}</td><td class="small mono">${(tableMap[t.table]?.viewNames||[]).slice(0,4).join(', ')||'—'}</td></tr>`).join('')}</tbody></table></div></div>`;
}

function renderConclusiones(){
  $('#sec-conclusiones').innerHTML=secHead(14,'Conclusiones técnicas','Hallazgos verificables, discrepancias y límites del análisis estático del respaldo.')+`
  <div class="grid g2"><div class="card pad"><span class="eyebrow">Hallazgos</span><h3 style="margin:0 0 10px">Lo que el respaldo confirma</h3><ol class="small" style="padding-left:20px;line-height:1.9">
  <li>La base de datos se denomina <b>${esc(DATA.meta.database)}</b>, coincidiendo con el nombre esperado.</li>
  <li>Existen <b>${T.length} tablas</b> y <b>${TR.length} triggers</b>, ambos iguales a lo esperado.</li>
  <li>Se documentan <b>${V.length} vistas finales</b>, siete más de las 28 esperadas; el valor real se conserva.</li>
  <li>Hay <b>${S.totalColumns} columnas</b>, <b>${S.totalPK} componentes de PK</b>, <b>${S.totalFK} FK</b>, <b>${S.totalIndexes} índices</b> y <b>${S.totalChecks} CHECK</b>.</li>

  <li>No hay procedimientos ni funciones almacenadas en el archivo analizado.</li></ol></div>
  <div class="card pad"><span class="eyebrow">Límites</span><h3 style="margin:0 0 10px">Lo que no puede afirmarse</h3><ol class="small" style="padding-left:20px;line-height:1.9">
  <li>Las descripciones funcionales y las clasificaciones semánticas son <b>inferencias técnicas</b> basadas en nombres, tipos y relaciones; no texto documental del DDL.</li>
  <li>No se conocen reglas de negocio no expresadas en DDL, CHECK o triggers.</li>

  </tbody></table></div></div>`;

  <div class="grid g2"><div class="card pad"><span class="eyebrow">Impresión / PDF</span><h3 style="margin:0 0 12px">Documentos</h3><div style="display:flex;gap:9px;flex-wrap:wrap">

function printDoc(scope){
  const all=scope==='all';
  const secKey=({dictionary:'diccionario',triggers:'triggers',views:'vistas'})[scope]||scope;
  if(all) SECTIONS.forEach(([id])=>RENDER[id]?.()); else RENDER[secKey]?.();
  document.body.className=all?'printing-all':'print-scope-'+scope;
  if(!all) $$('.section').forEach(s=>s.classList.toggle('active',s.id==='sec-'+secKey));
  setTimeout(()=>{window.print();setTimeout(()=>{document.body.className='';if(!all)navigate(current);},300);},80);
}

const RENDER={inicio:renderInicio,dashboard:renderDashboard,tablas:renderTablas,diccionario:renderDiccionario,clasificacion:renderClasificacion,dominios:renderDominios,eer:renderEER,relaciones:renderRelaciones,triggers:renderTriggers,vistas:renderVistas,indices:renderIndices,registros:renderRegistros,dependencias:renderDependencias,conclusiones:renderConclusiones,exportacion:renderExportacion};
function initTheme(){
  let t='light';try{t=localStorage.getItem('atlas_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');}catch(e){}
  document.documentElement.dataset.theme=t;
  $('#themeBtn').onclick=()=>{t=t==='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('atlas_theme',t);}catch(e){}toast('Tema '+(t==='dark'?'oscuro':'claro'));};
}
function init(){
  buildNav(); buildSearchIndex(); initTheme();
  $('#printFront').innerHTML=printFrontHTML();
  $('#brandDb').textContent=DATA.meta.database+' · MySQL 8.0';
  $('#collapseBtn').onclick=()=>$('#app').classList.toggle('collapsed');
  $('#mobileMenu').onclick=()=>$('#app').classList.toggle('mobile-open');
  $('#drawerBackdrop').onclick=closeDrawer;
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();$('#searchResults').classList.remove('show');}});
  const si=$('#globalSearch'); si.oninput=e=>runSearch(e.target.value); si.onfocus=()=>{if(si.value.length>=2)runSearch(si.value)};
  document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))$('#searchResults').classList.remove('show');});
  $('#helpBtn').onclick=()=>openDrawer(drawerHead('Ayuda','Guía del explorador','Interfaz de una sola página')+`<div class="drawer-section"><h4>Recorrido recomendado</h4><ol class="help-list"><li><b>Inicio</b>: portada académica y validación de conteos.</li><li><b>Dashboard</b>: estadísticas reales del respaldo.</li><li><b>Explorador de tablas</b>: busca y abre una tabla.</li><li><b>Diccionario</b>: expande cualquier columna para ver su ficha completa.</li><li><b>EER</b>: arrastra entidades, usa la rueda para acercar y haz clic en relaciones.</li><li><b>Triggers y vistas</b>: filtra y consulta el SQL original.</li></ol></div>

window.addEventListener('error',e=>console.error('Atlas error:',e.message));
init();
